description: "Bernhard Haslhofer is a researcher at the Complexity Science Hub Vienna working on cryptoasset analytics, blockchain forensics, and decentralized finance."
baseurl: ""
url: "https://bernhardhaslhofer.info"

# Social profiles: single source for the sidebar, footer, and JSON-LD sameAs
social_links:
  - name: GitHub
    url: https://github.com/behas
    icon: fab fa-github
  - name: LinkedIn
    url: https://www.linkedin.com/in/bernhardhaslhofer/
    icon: fab fa-linkedin
  - name: Google Scholar
    url: https://scholar.google.com/citations?user=15K0uBUAAAAJ&hl=en
    icon: ai ai-google-scholar
  - name: ORCID
    url: https://orcid.org/0000-0002-0415-4491
    icon: ai ai-orcid
  - name: Bluesky
    url: https://bsky.app/profile/behas.bsky.social
    icon: fab fa-bluesky

# Build settings
plugins:
  - jekyll-sitemap

sass:
  style: compact # possible values: nested expanded compact compressed

# Jekyll Scholar configuration
scholar:
  style: apa
  locale: en
  source: ./_data
  bibliography: bibliography.bib
  bibliography_template: bib
  sort_by: year
  order: descending
  group_by: year
  group_order: descending

exclude:
  - README.md
  - CLAUDE.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - .ruby-version


